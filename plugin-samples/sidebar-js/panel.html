<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --plugin-demo-accent: #f59e0b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; font: 12px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--color-base-content, #1f2937); background: transparent;
  }
  .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--plugin-demo-accent); }
  .title { font-weight: 600; }
  .muted { color: color-mix(in oklab, var(--color-base-content, #1f2937) 55%, transparent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    border: 1px solid color-mix(in oklab, var(--color-base-content, #1f2937) 16%, transparent);
    background: color-mix(in oklab, var(--color-base-100, #fff) 86%, var(--plugin-demo-accent));
    color: inherit; border-radius: 7px; padding: 6px 8px; font: inherit; cursor: pointer; text-align: left;
  }
  button:hover { border-color: var(--plugin-demo-accent); }
  button:disabled { opacity: .45; cursor: default; }
  pre {
    margin: 8px 0 0; padding: 8px; min-height: 42px; max-height: 110px; overflow: auto;
    border-radius: 7px; background: color-mix(in oklab, var(--color-base-content, #1f2937) 7%, transparent);
    white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  input[type="range"] { flex: 1; accent-color: var(--plugin-demo-accent); }
</style>
</head>
<body>
  <div class="head"><span class="dot"></span><span class="title">沙箱侧栏示例</span><span class="muted" id="state">等待宿主初始化…</span></div>
  <div class="grid">
    <button id="settings" disabled>打开插件设置</button>
    <button id="link" disabled>打开长亭官网</button>
    <button id="copy" disabled>复制一句</button>
    <button id="ping" disabled>调用本地进程</button>
  </div>
  <pre id="out">插件 JS 运行在独立 iframe 里,不能直接访问主页面或 Tauri IPC。</pre>
  <div class="row"><span class="muted">面板高度</span><input id="height" type="range" min="120" max="720" value="300" /></div>
<script>
(() => {
  let token = "";
  const $ = (id) => document.getElementById(id);
  const out = (text) => { $("out").textContent = text; };
  const send = (payload) => window.parent.postMessage({ __mcPlugin: token, ...payload }, "*");

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type === "init" && data.__mcPlugin) {
      token = data.__mcPlugin;
      for (const [key, value] of Object.entries(data.theme || {})) {
        if (key.startsWith("--")) document.documentElement.style.setProperty(key, value);
      }
      $("state").textContent = data.capabilities && data.capabilities.process ? "进程插件已授权" : "仅沙箱 UI";
      for (const id of ["settings", "link", "copy", "ping"]) $(id).disabled = false;
      postHeight();
      return;
    }
    if (data.type === "process_result" && token) {
      out(data.error ? "进程返回错误: " + data.error : "进程返回: " + JSON.stringify(data.result, null, 2));
    }
  });

  const postHeight = () => {
    const value = Number($("height").value);
    send({ type: "resize", height: value });
  };
  $("height").addEventListener("input", postHeight);
  $("settings").addEventListener("click", () => send({ type: "action", action: { type: "open_settings", section: "plugins" } }));
  $("link").addEventListener("click", () => send({ type: "action", action: { type: "open_url", url: "https://www.chaitin.cn/" } }));
  $("copy").addEventListener("click", () => send({ type: "action", action: { type: "copy", text: "来自沙箱插件面板的问候" } }));
  $("ping").addEventListener("click", () => {
    out("正在调用 node server.js…");
    send({ type: "process", id: String(Date.now()), method: "demo.echo", params: { text: "hello from iframe" } });
  });
})();
</script>
</body>
</html>
